<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire Idle</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#080b12;color:#f5f7ff}button{cursor:pointer;border:0}
.wrap{max-width:1100px;margin:auto;padding:28px 18px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}
h1{font-size:42px;margin:0;background:linear-gradient(90deg,#fff,#9c8cff);-webkit-background-clip:text;color:transparent}
.sub{color:#8e97aa;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.card,.building{background:#111624;border:1px solid #252d40;border-radius:18px;padding:18px;box-shadow:0 10px 30px #0004}.label{font-size:12px;color:#8e97aa;text-transform:uppercase;letter-spacing:.12em}.value{font-size:28px;font-weight:800;margin-top:6px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.big{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.coin{width:190px;height:190px;border-radius:50%;font-size:27px;font-weight:900;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffd43b 35%,#9c6b00 100%);box-shadow:0 0 60px #f5c54255, inset 0 0 0 9px #fff4;transition:.08s}
.coin:active{transform:scale(.96)}.income{margin-top:22px;color:#aeb8ca}.buildings{display:grid;gap:10px}.building{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bname{font-weight:800}.desc{font-size:13px;color:#8e97aa;margin-top:4px}.buy{background:#7667ff;color:white;padding:11px 15px;border-radius:11px;font-weight:800}.buy:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:10px;margin-top:14px}.secondary{background:#1a2130;color:#dce2ef;padding:11px 15px;border-radius:11px}
.notice{margin-top:15px;color:#818ba0;font-size:13px;text-align:center}.prestige{border:1px solid #4d3f91;background:#17132b}
@media(max-width:760px){.hero{align-items:start;flex-direction:column}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}h1{font-size:34px}.coin{width:165px;height:165px}}

.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#111624;color:#aeb8ca;border:1px solid #252d40;padding:10px 14px;border-radius:11px;font-weight:800}.tab.active{background:#7667ff;color:#fff}
.panel{background:#111624;border:1px solid #252d40;border-radius:18px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #202738}.row:last-child{border-bottom:0}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#20283a;color:#aeb8ca}.done{color:#71e6a4}.progress{height:7px;background:#202738;border-radius:9px;overflow:hidden;margin-top:8px}.bar{height:100%;background:#7667ff;width:0}.gold{color:#ffd76a}.small{font-size:12px;color:#8e97aa}

</head>
<body><main class="wrap">
<section class="hero"><div><h1>Empire Idle</h1><div class="sub">Baue dein Imperium. Verdiene auch offline.</div></div><div class="label">MVP • v1.0</div></section>
<section class="stats">
<div class="card"><div class="label">Geld</div><div class="value" id="money">0</div></div>
<div class="card"><div class="label">Pro Sekunde</div><div class="value" id="income">0</div></div>
<div class="card"><div class="label">Prestige</div><div class="value" id="prestige">0</div></div><div class="card"><div class="label">Imperiums-Level</div><div class="value" id="level">1</div><div class="small" id="xpInfo">0 / 100 XP</div></div>
</section>
<div class="nav"><button class="tab active" data-tab="game">Imperium</button><button class="tab" data-tab="quests">Quests</button><button class="tab" data-tab="achievements">Achievements</button><button class="tab" data-tab="shop">Shop</button></div>
<div id="game" class="tabpage"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><div class="label">Aktive Region</div><b id="regionName">Kernland</b><div class="small" id="regionInfo"></div></div><span class="pill" id="regionMult">×1</span></div></div><section class="grid">
<div class="card big"><button class="coin" id="click">VERDIENEN</button><div class="income" id="clickInfo">+1 pro Klick</div><div class="actions"><button class="secondary" id="save">Speichern</button><button class="secondary" id="reset">Reset</button></div><div class="notice" id="offline"></div></div>
<div><div class="buildings" id="buildings"></div><div class="card prestige" style="margin-top:10px"><div class="label">Prestige</div><div style="margin:7px 0 12px">Setzt dein Geld und Gebäude zurück und gibt dir dauerhafte Multiplikatoren.</div><button class="buy" id="prestigeBtn">Prestige durchführen</button></div></div>
</section></div>
<div id="quests" class="tabpage" style="display:none"><div class="panel"><div class="label">Tagesquests</div><div id="questsList"></div></div></div>
<div id="achievements" class="tabpage" style="display:none"><div class="panel"><div class="label">Meilensteine</div><div id="achievementsList"></div></div></div>
<div id="shop" class="tabpage" style="display:none"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="label">Empire Shop</div><div class="small">Premium-Währung: <span class="gold" id="gems">0 💎</span></div></div></div><div id="shopList"></div></div></div>
</main>
<script>
const defs=[
{name:"Bergwerk",desc:"Fördert Rohstoffe.",base:25,prod:1,region:0},
{name:"Farm",desc:"Versorgt deine Wirtschaft.",base:150,prod:7,region:0},
{name:"Werkstatt",desc:"Produziert Waren.",base:900,prod:45,region:0},
{name:"Handelshaus",desc:"Erweitert dein Handelsnetz.",base:6000,prod:280,region:0},
{name:"Stahlwerk",desc:"Baut die industrielle Basis aus.",base:50000,prod:2500,region:0},
{name:"Hafen",desc:"Öffnet neue Handelswege.",base:350000,prod:15000,region:1},
{name:"Bank",desc:"Vermehrt dein Kapital.",base:2500000,prod:90000,region:1},
{name:"Wolkenkratzer",desc:"Verdichtet deine Metropole.",base:18000000,prod:520000,region:1},
{name:"Raumhafen",desc:"Erschließt den globalen Markt.",base:150000000,prod:3200000,region:2},
{name:"Tech-Imperium",desc:"Kontrolliert die Zukunftstechnologie.",base:1500000000,prod:22000000,region:2},
{name:"Orbitalstation",desc:"Produktion außerhalb der Erde.",base:20000000000,prod:180000000,region:3},
{name:"Sternenkonzern",desc:"Dein Imperium wird interstellar.",base:500000000000,prod:1500000000,region:3}
];
const key="empireIdleSave";
let s={money:0,prestige:0,levels:Array(defs.length).fill(0),last:Date.now(),clicks:0,quests:{click:0,buy:0,earn:0},daily:0,day:"",gems:25,boostUntil:0,theme:"default",xp:0,level:1};
const quests=[{id:"click",name:"Klick-Marathon",goal:100, reward:500, text:"Klicke 100-mal."},{id:"buy",name:"Investieren",goal:10,reward:2500,text:"Kaufe 10 Gebäude."},{id:"earn",name:"Erster Erfolg",goal:10000,reward:10000,text:"Verdiene insgesamt 10.000 Geld."}];
const achievements=[{name:"Erster Schritt",check:()=>s.money>=100},{name:"Tycoon",check:()=>s.money>=100000},{name:"Baumeister",check:()=>s.levels.reduce((a,b)=>a+b,0)>=25},{name:"Imperator",check:()=>s.prestige>=3},{name:"Milliardär",check:()=>s.money>=1e9}];
try{s={...s,...JSON.parse(localStorage.getItem(key)||"{}")};s.levels=[...(s.levels||[])];while(s.levels.length<defs.length)s.levels.push(0);s.gems=s.gems??25;s.boostUntil=s.boostUntil??0;s.theme=s.theme||"default";s.xp=s.xp??0;s.level=s.level??1}catch{}
const fmt=n=>n>=1e12?(n/1e12).toFixed(2)+"T":n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(2)+"K":Math.floor(n).toLocaleString("de-DE");
const mult=()=>1+s.prestige*.15;
const boost=()=>Date.now()<s.boostUntil?2:1;
const regions=[{name:"Kernland",unlock:0,mult:1},{name:"Handelsbund",unlock:20,mult:1.5},{name:"Weltmetropole",unlock:50,mult:2.5},{name:"Orbitalzone",unlock:100,mult:5}];
const totalLevels=()=>s.levels.reduce((a,b)=>a+b,0);
const regionForLevels=()=>Math.min(regions.length-1,regions.reduce((best,r,i)=>totalLevels()>=r.unlock?i:best,0));
const regionMult=()=>regions[regionForLevels()].mult;
const totalMult=()=>mult()*boost()*regionMult();
const xpNeeded=()=>Math.floor(100*Math.pow(1.22,s.level-1));
function gainXP(n){s.xp+=Math.max(0,n);while(s.xp>=xpNeeded()){s.xp-=xpNeeded();s.level++;if(s.level%5===0)s.gems+=2}}
const shopItems=[{name:"2× Produktion",desc:"Verdoppelt Einkommen für 5 Minuten.",cost:10,action:()=>{if(s.gems>=10){s.gems-=10;s.boostUntil=Math.max(Date.now(),s.boostUntil)+300000;save();render()}}},{name:"Kapital-Spritze",desc:"Sofort 60 Sekunden deines aktuellen Einkommens.",cost:8,action:()=>{if(s.gems>=8){s.gems-=8;s.money+=income()*60;save();render()}}},{name:"VIP-Farbe",desc:"Schaltet einen goldenen VIP-Look frei.",cost:30,action:()=>{if(s.gems>=30){s.gems-=30;s.theme="vip";document.body.classList.add("vip");save();render()}}}];
const price=(i)=>Math.floor(defs[i].base*Math.pow(1.16,s.levels[i]));
const unlocked=(i)=>defs[i].region<=regionForLevels();
const income=()=>defs.reduce((a,d,i)=>a+(unlocked(i)?d.prod*s.levels[i]:0),0)*totalMult();
function render(){
document.getElementById("money").textContent=fmt(s.money);
document.getElementById("income").textContent=fmt(income());
document.getElementById("prestige").textContent=s.prestige+"×";
const ri=regionForLevels(),rr=regions[ri];
document.getElementById("level").textContent=s.level;
document.getElementById("xpInfo").textContent=fmt(s.xp)+" / "+fmt(xpNeeded())+" XP";
document.getElementById("regionName").textContent=rr.name;
document.getElementById("regionMult").textContent="×"+rr.mult;
document.getElementById("regionInfo").textContent=ri===regions.length-1?"Maximale Region erreicht.":(regions[ri+1].unlock-totalLevels())+" Gebäude-Level bis "+regions[ri+1].name;
document.getElementById("clickInfo").textContent="+"+fmt(totalMult())+" pro Klick";
document.getElementById("buildings").innerHTML=defs.map((d,i)=>{let p=price(i),l=s.levels[i],ok=unlocked(i),need=regions[d.region].unlock;return '<div class="building"><div><div class="bname">'+d.name+' <span style="color:#8e97aa">Lv.'+l+'</span></div><div class="desc">'+(ok?d.desc+' • +'+fmt(d.prod*totalMult())+'/s':'🔒 Freischaltung ab '+need+' Gebäude-Level')+'</div></div><button class="buy" data-i="'+i+'" '+(!ok||s.money<p?'disabled':'')+'>'+(!ok?'Gesperrt':fmt(p)+' kaufen')+'</button></div>'}).join("");
document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let i=+b.dataset.i,p=price(i);if(s.money>=p&&unlocked(i)){s.money-=p;s.levels[i]++;s.quests.buy++;gainXP(Math.max(5,Math.floor(p/100)));save();render()}});
document.getElementById("prestigeBtn").disabled=s.money<1000000;
document.getElementById("gems").textContent=s.gems+" 💎";
renderShop();
renderQuests();renderAchievements();
}
function save(){s.last=Date.now();localStorage.setItem(key,JSON.stringify(s))}
function renderQuests(){document.getElementById("questsList").innerHTML=quests.map(q=>{let v=s.quests[q.id]||0,done=v>=q.goal;return '<div class="row"><div><b>'+q.name+'</b><div class="small">'+q.text+' Belohnung: <span class="gold">'+fmt(q.reward)+'</span></div><div class="progress"><div class="bar" style="width:'+Math.min(100,v/q.goal*100)+'%"></div></div></div><div class="'+(done?'done':'pill')+'">'+(done?'✓ Fertig':v+'/'+q.goal)+'</div></div>'}).join("")}
function renderShop(){document.getElementById("shopList").innerHTML=shopItems.map((x,i)=>'<div class="row"><div><b>'+x.name+'</b><div class="small">'+x.desc+'</div></div><button class="buy" '+(s.gems<x.cost?'disabled':'')+' data-shop="'+i+'">'+x.cost+' 💎</button></div>').join("");document.querySelectorAll("[data-shop]").forEach(b=>b.onclick=()=>shopItems[+b.dataset.shop].action())}
function renderAchievements(){document.getElementById("achievementsList").innerHTML=achievements.map(a=>'<div class="row"><b>'+a.name+'</b><span class="'+(a.check()?'done':'pill')+'">'+(a.check()?'✓ Freigeschaltet':'Gesperrt')+'</span></div>').join("")}
function dailyReward(){let d=new Date().toISOString().slice(0,10);if(s.day!==d){s.day=d;s.daily=1;s.money+=1000*mult();document.getElementById("offline").textContent="Tagesbonus: +"+fmt(1000*mult());save()}}
function tick(){let g=income()/10;s.money+=g;s.quests.earn+=g;gainXP(g/10);render()}
document.getElementById("click").onclick=()=>{s.money+=totalMult();gainXP(1);s.clicks++;s.quests.click=Math.min(100,s.clicks);s.quests.earn+=totalMult();if(s.quests.click>=100&&s.quests.click<101){s.money+=500}render();save()};
document.getElementById("save").onclick=save;
document.getElementById("reset").onclick=()=>{if(confirm("Spielstand wirklich löschen?")){localStorage.removeItem(key);location.reload()}};
document.getElementById("prestigeBtn").onclick=()=>{if(s.money>=1000000){s.prestige++;s.money=0;s.gems+=5;s.xp=0;s.level=1;s.levels=Array(defs.length).fill(0);save();render()}};
const away=Math.max(0,Math.min((Date.now()-(s.last||Date.now()))/1000,8*3600));if(away>10){s.money+=income()*away;document.getElementById("offline").textContent="Offline verdient: +"+fmt(income()*away)}
dailyReward();if(s.theme==="vip")document.body.classList.add("vip");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tabpage").forEach(x=>x.style.display="none");b.classList.add("active");document.getElementById(b.dataset.tab).style.display="block"});
render();setInterval(tick,100);
</script></body></html>
